<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Equipo - JEMS Band</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="icon" type="image/png" href="https://banda.micasajems.com/images/logobandajems.png" />
    <link rel="apple-touch-icon" href="https://banda.micasajems.com/images/logobandajems.png" />

    <meta name="description" content="Control de eventos, lineup y setlist oficial de la Banda JEMS." />
    <meta name="author" content="Nilson Uzcátegui" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://banda.micasajems.com/" />
    <meta property="og:title" content="JEMS Band - Control de Eventos" />
    <meta
      property="og:description"
      content="Consulta el próximo evento, los músicos asignados y el setlist de alabanza de la Banda JEMS."
    />
    <meta property="og:image" content="https://banda.micasajems.com/images/logobandajems.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://banda.micasajems.com/" />
    <meta name="twitter:title" content="JEMS Band - Control de Eventos" />
    <meta name="twitter:description" content="Consulta el próximo evento y lineup oficial de la Banda JEMS." />
    <meta name="twitter:image" content="https://banda.micasajems.com/images/logobandajems.png" />

    <meta name="theme-color" content="#1e1b4b" />

    <style>
      .purple-gradient {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #3b0764 100%);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(5px);
        z-index: 50;
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background: #1e1b4b;
        border: 1px solid rgba(168, 85, 247, 0.4);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body class="purple-gradient min-h-screen text-slate-100 p-4">
    <div id="modal-rol" class="modal-overlay">
      <div class="modal-content w-full max-w-md p-6 rounded-2xl mx-4">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-xl font-bold text-purple-400">Nuevo Rol</h3>
          <button class="close-modal text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <form id="form-rol" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nombre de la Función</label>
            <input
              type="text"
              id="input-nombre-rol"
              name="nombre_rol"
              required
              class="w-full bg-black/20 border border-white/10 rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500"
              placeholder="Ej: Sonidista"
            />
          </div>
          <button
            type="submit"
            id="btn-guardar-rol"
            class="w-full bg-purple-600 hover:bg-purple-500 p-3 rounded-xl font-bold transition-all"
          >
            Guardar Rol
          </button>
        </form>
      </div>
    </div>

    <div id="modal-miembro" class="modal-overlay">
      <div class="modal-content w-full max-w-md p-6 rounded-2xl mx-4">
        <div class="flex justify-between items-center mb-6">
          <h3 id="titulo-modal-miembro" class="text-xl font-bold text-purple-400">Nuevo Miembro</h3>
          <button class="close-modal text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
        </div>
        <form id="form-miembro" class="space-y-4" enctype="multipart/form-data">
          <input type="hidden" id="m-id" value="" />
          <input type="hidden" id="m-foto" value="" />
          <div>
            <input
              type="text"
              id="m-nombre"
              placeholder="Nombre Completo"
              class="w-full bg-black/20 border border-white/10 rounded-lg p-3 outline-none focus:ring-2 focus:ring-purple-500"
              required
            />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Foto del Integrante</label>
            <div
              id="m-foto-dropzone"
              class="relative border-2 border-dashed border-white/15 rounded-xl p-4 bg-black/20 hover:border-purple-500/60 transition-all cursor-pointer"
            >
              <input
                type="file"
                id="m-foto-file"
                accept="image/png,image/jpeg,image/webp,image/gif"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
              />
              <div id="m-foto-placeholder" class="flex flex-col items-center justify-center text-center py-4">
                <i class="fas fa-cloud-upload-alt text-3xl text-purple-400 mb-2"></i>
                <p class="text-sm text-slate-300 font-semibold">Haz clic o arrastra una imagen</p>
                <p class="text-[10px] text-slate-500 uppercase mt-1">JPG, PNG, WEBP o GIF · máx. 5MB</p>
              </div>
              <div id="m-foto-preview-wrap" class="hidden flex-col items-center gap-3">
                <img
                  id="m-foto-preview"
                  class="w-28 h-28 rounded-full object-cover border-2 border-purple-500 shadow-lg shadow-purple-500/30"
                  alt="Vista previa"
                />
                <p id="m-foto-status" class="text-xs text-slate-400 italic">Subiendo imagen...</p>
              </div>
            </div>
            <button
              type="button"
              id="m-foto-clear"
              class="hidden mt-2 text-[11px] text-slate-400 hover:text-red-400 uppercase font-bold tracking-wider"
            >
              <i class="fas fa-times mr-1"></i> Quitar imagen
            </button>
          </div>

          <button
            type="submit"
            id="btn-guardar-miembro"
            class="w-full bg-green-600 hover:bg-green-500 p-3 rounded-xl font-bold transition-all"
          >
            Guardar Cambios
          </button>
        </form>
      </div>
    </div>

    <div class="max-w-6xl mx-auto">
      <nav class="flex gap-8 border-b border-white/10 mb-8 overflow-x-auto">
        <a href="/" class="pb-4 px-2 font-bold text-slate-400 hover:text-purple-300 transition-colors uppercase"
          >Inicio</a
        >
        <a href="admin.html" class="pb-4 px-2 font-bold text-slate-400">EVENTOS</a>
        <a href="admin-actividades.html" class="pb-4 px-2 font-bold text-slate-400 hover:text-purple-300 transition-colors uppercase">Actividades</a>
        <a href="equipo-roles.html" class="pb-4 px-2 font-bold border-b-4 border-purple-500 text-purple-400"
          >EQUIPO & ROLES</a
        >
        <a href="repertorio.html" class="pb-4 px-2 font-bold text-slate-400">REPERTORIO</a>
        <a href="propuestas.html" class="pb-4 px-2 font-bold text-slate-400 hover:text-purple-300 transition-colors uppercase">Propuestas</a>
      </nav>

      <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold border-l-4 border-purple-500 pl-3">Integrantes</h2>
        <button
          id="btn-abrir-miembro"
          class="bg-green-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-500 transition-all"
        >
          + Nuevo Miembro
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="lista-miembros"></div>

      <div class="mt-12 bg-black/30 p-6 rounded-2xl border border-dashed border-white/10">
        <div class="flex justify-between items-center mb-6">
          <h3 class="text-purple-400 font-bold uppercase text-sm tracking-wider">Roles Disponibles</h3>
          <button
            id="btn-abrir-rol"
            class="text-xs bg-purple-600/20 border border-purple-500/50 px-3 py-1 rounded-lg text-purple-300 font-bold hover:bg-purple-600/40 transition-all"
          >
            + AGREGAR ROL
          </button>
        </div>
        <div class="flex flex-wrap gap-3" id="lista-roles"></div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        // Detección automática de entorno (Local vs Producción)
        const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
        const rutaApi = isLocal ? "http://localhost/bandajems/backend/api/" : "https://api.micasajems.com/api/";
        const baseImagenes = isLocal ? `${window.location.origin}/bandajems/frontend` : window.location.origin;
        console.log(`🚀 Corriendo en modo: ${isLocal ? "Localhost" : "Producción"}`);

        // Convierte la foto_url almacenada (puede ser absoluta o relativa) en una URL servible.
        function resolverFotoUrl(fotoUrl) {
          if (!fotoUrl) return `${baseImagenes}/images/default-avatar.svg`;
          if (/^https?:\/\//i.test(fotoUrl)) return fotoUrl;
          return `${baseImagenes}/${fotoUrl.replace(/^\/+/, "")}`;
        }

        // --- 1. CARGA INICIAL DE DATOS ---
        cargarRoles();
        cargarMiembros();

        function cargarRoles() {
          $.ajax({
            url: rutaApi + "get_roles.php", // Asegúrate de crear este archivo para listar
            type: "GET",
            success: function (response) {
              $("#lista-roles").empty();
              response.forEach((rol) => {
                $("#lista-roles").append(`
                                  <span class="bg-white/5 px-4 py-2 rounded-full text-xs border border-white/10 flex items-center gap-3 group hover:border-purple-500/50 transition-all">
                                      ${rol.nombre_rol}
                                      <i class="fas fa-times text-slate-500 hover:text-red-400 cursor-pointer remove-item" data-id="${rol.id}"></i>
                                  </span>
                              `);
              });
            },
          });
        }

        // --- CARGAR MIEMBROS ---
        function cargarMiembros() {
          $.ajax({
            url: rutaApi + "get_miembros.php",
            type: "GET",
            success: function (response) {
              $("#lista-miembros").empty();
              response.forEach((m) => {
                $("#lista-miembros").append(`
                              <div class="glass-card p-4 rounded-xl flex justify-between items-center hover:bg-white/5 transition-all">
                                  <div class="flex items-center gap-3">
                                      <img src="${resolverFotoUrl(m.foto_url)}" data-foto="${m.foto_url || ""}" class="w-10 h-10 rounded-full border border-purple-500 object-cover shadow-lg shadow-purple-500/20">
                                      <span class="font-semibold">${m.nombre}</span>
                                  </div>
                                  <button class="text-slate-500 hover:text-white transition-colors edit-miembro" data-id="${m.id}">
                                      <i class="fas fa-edit text-xs"></i>
                                  </button>
                              </div>
                          `);
              });
            },
          });
        }

        // --- 2. LÓGICA DE MODALES ---
        $("#btn-abrir-rol").on("click", () => $("#modal-rol").css("display", "flex").hide().fadeIn(200));

        // 1. Al dar click en el botón "Nuevo Miembro" (Limpiar el form)
        $("#btn-abrir-miembro").on("click", function () {
          $("#form-miembro")[0].reset();
          $("#m-id").val("");
          $("#titulo-modal-miembro").text("Nuevo Miembro");
          $("#btn-guardar-miembro").text("Registrar Miembro");
          resetFotoMiembro();
          $("#modal-miembro").css("display", "flex").hide().fadeIn(200);
        });

        $(".close-modal").on("click", () => $(".modal-overlay").fadeOut(200));
        $(window).on("click", (e) => {
          if ($(e.target).hasClass("modal-overlay")) $(".modal-overlay").fadeOut(200);
        });

        // --- 3. PETICIÓN GUARDAR ROL ---
        $("#form-rol").on("submit", function (e) {
          e.preventDefault();
          const btn = $("#btn-guardar-rol");
          const nombreRol = $("#input-nombre-rol").val();

          btn.prop("disabled", true).text("Guardando...");

          $.ajax({
            url: rutaApi + "save_rol.php",
            type: "POST",
            data: { nombre_rol: nombreRol },
            dataType: "json",
            success: function (response) {
              if (response.status === "success") {
                $("#modal-rol").fadeOut(200);
                $("#input-nombre-rol").val("");
                cargarRoles(); // Recargamos la lista
              }
            },
            error: function (xhr) {
              alert("Error al guardar: " + xhr.responseJSON.message);
            },
            complete: function () {
              btn.prop("disabled", false).text("Guardar Rol");
            },
          });
        });

        // --- 4. ELIMINAR ITEM (OPCIONAL) ---
        $(document).on("click", ".remove-item", function () {
          const id = $(this).data("id");
          if (confirm("¿Seguro que deseas eliminar este rol?")) {
            // Aquí iría tu api/delete_rol.php
            $(this).parent().fadeOut();
          }
        });

        // --- SUBIDA DE FOTO DE MIEMBRO ---
        const MAX_FOTO_MB = 5;

        function resetFotoMiembro() {
          $("#m-foto").val("");
          $("#m-foto-file").val("");
          $("#m-foto-preview").attr("src", "");
          $("#m-foto-preview-wrap").addClass("hidden").removeClass("flex");
          $("#m-foto-placeholder").removeClass("hidden");
          $("#m-foto-status").removeClass("text-red-400 text-green-400").addClass("text-slate-400").text("");
          $("#m-foto-clear").addClass("hidden");
          $("#m-foto-dropzone").removeClass("border-red-500/60 border-green-500/60");
        }

        function mostrarPreviewFoto(url, statusText, statusClass) {
          $("#m-foto-placeholder").addClass("hidden");
          $("#m-foto-preview-wrap").removeClass("hidden").addClass("flex");
          $("#m-foto-preview").attr("src", url);
          $("#m-foto-status").removeClass("text-red-400 text-green-400 text-slate-400").addClass(statusClass).text(statusText);
          $("#m-foto-clear").removeClass("hidden");
        }

        $("#m-foto-file").on("change", function () {
          const archivo = this.files && this.files[0];
          if (!archivo) return;

          if (archivo.size > MAX_FOTO_MB * 1024 * 1024) {
            mostrarPreviewFoto("", "La imagen supera el máximo de " + MAX_FOTO_MB + "MB.", "text-red-400");
            this.value = "";
            return;
          }

          const tiposPermitidos = ["image/jpeg", "image/jpg", "image/png", "image/webp", "image/gif"];
          if (!tiposPermitidos.includes(archivo.type)) {
            mostrarPreviewFoto("", "Formato no permitido. Usa JPG, PNG, WEBP o GIF.", "text-red-400");
            this.value = "";
            return;
          }

          const reader = new FileReader();
          reader.onload = (ev) => mostrarPreviewFoto(ev.target.result, "Subiendo imagen...", "text-slate-400");
          reader.readAsDataURL(archivo);

          const fd = new FormData();
          fd.append("foto", archivo);

          $.ajax({
            url: rutaApi + "upload_image.php",
            type: "POST",
            data: fd,
            processData: false,
            contentType: false,
            dataType: "json",
            success: function (res) {
              if (res && res.status === "success" && res.url) {
                $("#m-foto").val(res.url);
                mostrarPreviewFoto(resolverFotoUrl(res.url), "Imagen lista ✓", "text-green-400");
              } else {
                mostrarPreviewFoto("", (res && res.message) || "No se pudo subir la imagen.", "text-red-400");
              }
            },
            error: function (xhr) {
              let msg = "No se pudo subir la imagen.";
              if (xhr && xhr.responseJSON && xhr.responseJSON.message) msg = xhr.responseJSON.message;
              mostrarPreviewFoto("", msg, "text-red-400");
            },
          });
        });

        $("#m-foto-clear").on("click", function () {
          resetFotoMiembro();
        });

        // 2. Al dar click en EDITAR (Cargar datos)
        $(document).on("click", ".edit-miembro", function () {
          const id = $(this).data("id");
          const card = $(this).closest(".glass-card");
          const nombreActual = card.find("span").text();
          const fotoCruda = card.find("img").attr("data-foto") || "";

          $("#m-id").val(id);
          $("#m-nombre").val(nombreActual);
          $("#titulo-modal-miembro").text("Editar Miembro");
          $("#btn-guardar-miembro").text("Guardar Cambios");
          $("#m-foto-file").val("");
          $("#m-foto").val(fotoCruda);

          if (fotoCruda) {
            $("#m-foto-placeholder").addClass("hidden");
            $("#m-foto-preview-wrap").removeClass("hidden").addClass("flex");
            $("#m-foto-preview").attr("src", resolverFotoUrl(fotoCruda));
            $("#m-foto-status").removeClass("text-red-400 text-green-400 text-slate-400").addClass("text-slate-400").text("Imagen actual");
            $("#m-foto-clear").removeClass("hidden");
          } else {
            resetFotoMiembro();
          }

          $("#modal-miembro").css("display", "flex").hide().fadeIn(200);
        });

        // --- GUARDAR / ACTUALIZAR MIEMBRO (handler único) ---
        $("#form-miembro").on("submit", function (e) {
          e.preventDefault();
          const id = $("#m-id").val();
          const btn = $("#btn-guardar-miembro");
          const urlAccion = id === "" ? "save_miembro.php" : "update_miembro.php";
          const labelOriginal = btn.text();

          const datos = {
            id: id,
            nombre: $("#m-nombre").val().trim(),
            foto_url: $("#m-foto").val(),
          };

          if (!datos.nombre) {
            alert("El nombre es obligatorio.");
            return;
          }

          btn.prop("disabled", true).text("Guardando...");

          $.ajax({
            url: rutaApi + urlAccion,
            type: "POST",
            data: datos,
            dataType: "json",
            success: function (response) {
              if (response && response.status === "success") {
                $("#modal-miembro").fadeOut(200);
                $("#form-miembro")[0].reset();
                resetFotoMiembro();
                cargarMiembros();
              } else {
                alert((response && response.message) || "No se pudo guardar.");
              }
            },
            error: function (xhr) {
              alert("Error: " + ((xhr && xhr.responseJSON && xhr.responseJSON.message) || "Error desconocido"));
            },
            complete: function () {
              btn.prop("disabled", false).text(labelOriginal);
            },
          });
        });
      });
    </script>
  </body>
</html>
